name: syntax-check

# 每次 push 到 main 或打开 PR 时运行 verify.py：语法检查 + 两套离线回归
# （service_regression.py 与 glm_dual_draft_regression.py）。任何失败都会
# 阻止 PR 合并。不运行业务逻辑、不接触临床数据、无网络外呼。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unified offline verification (verify.py)
        run: python verify.py
